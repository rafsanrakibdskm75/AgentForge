# AgentForge no Docker local.
#
# Suba com `npm run docker:up`: o script detecta as contas do Claude Code no host e gera o
# docker-compose.override.yml (fora do controle de versão) com:
#   - montagens SOMENTE LEITURA de <conta>/projects e <conta>/sessions em /claude/<conta>/...
#     (nunca a pasta inteira da conta: lá ficam credenciais e configurações) e de ~/.agentforge/usage
#     (uso de 5h/semanal capturado pelo tap de statusline) em /usage;
#   - do Codex, SOMENTE <pasta>/sessions, <pasta>/archived_sessions e <pasta>/thread-writer-locks em
#     /codex/<conta>/... (nunca auth.json, config.toml, history.jsonl, logs nem os bancos SQLite);
#   - AGENTFORGE_CLAUDE_DIRS, AGENTFORGE_CODEX_DIRS, AGENTFORGE_ACCOUNTS e AGENTFORGE_USAGE_DIR.
# O Compose mescla o override automaticamente em qualquer `docker compose ...` rodado nesta pasta.
name: agentforge

services:
  agentforge:
    build: .
    image: agentforge:local
    container_name: agentforge
    restart: unless-stopped
    # Os transcripts são sensíveis: por padrão a porta é publicada SÓ na interface local do host
    # (AGENTFORGE_BIND=0.0.0.0 no .env libera a rede local; veja o README).
    ports:
      - "${AGENTFORGE_BIND:-127.0.0.1}:${AGENTFORGE_PORT:-4747}:4747"
      # A porta do acesso pelo celular (com login) só é publicada depois do npm run remote:setup: quem a junta é o
      # docker-compose.override.yml que o docker:up gera.
    volumes:
      - agentforge-data:/data
    # Opções que podem vir do .env (ou do ambiente) para dentro do container.
    environment:
      AGENTFORGE_ALLOWED_HOSTS: ${AGENTFORGE_ALLOWED_HOSTS:-}
      AGENTFORGE_DEMO: ${AGENTFORGE_DEMO:-}
      # O mesmo valor da porta publicada acima: o terminal (e o que age sobre as sessões) só liga com bind local.
      AGENTFORGE_BIND: ${AGENTFORGE_BIND:-127.0.0.1}
      AGENTFORGE_TERMINAL: ${AGENTFORGE_TERMINAL:-}
      # 0 desliga as mensagens pelo escritório (mandar mensagens aos agentes pela página e pelo terminal).
      AGENTFORGE_MENSAGENS: ${AGENTFORGE_MENSAGENS:-}
      # 0 desliga a verificação de versão nova (consulta às releases no GitHub a cada 6 h).
      AGENTFORGE_UPDATE_CHECK: ${AGENTFORGE_UPDATE_CHECK:-}
      AGENTFORGE_LANG: ${AGENTFORGE_LANG:-}
      # 0 desliga as sessões do Codex no escritório.
      AGENTFORGE_CODEX: ${AGENTFORGE_CODEX:-}
      # 1 liga o Novo agente pelo escritório (no Docker, quem começa a sessão é o auxiliar do host, npm run
      # codex:bridge; o terminal interativo em si não roda no container).
      AGENTFORGE_PTY: ${AGENTFORGE_PTY:-}
      # Acesso remoto com login (server/http/remote.ts).
      AGENTFORGE_REMOTE_USER: ${AGENTFORGE_REMOTE_USER:-}
      AGENTFORGE_REMOTE_PASSWORD_HASH: ${AGENTFORGE_REMOTE_PASSWORD_HASH:-}
      AGENTFORGE_REMOTE_ALLOW: ${AGENTFORGE_REMOTE_ALLOW:-}
      AGENTFORGE_REMOTE_INSECURE_HTTP: ${AGENTFORGE_REMOTE_INSECURE_HTTP:-}
    # Endurecimento: sistema de arquivos só leitura (exceto /data e /tmp), sem capabilities extras.
    read_only: true
    # /tmp em memória, com teto: sem `size` o Docker deixa usar metade da RAM do host.
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Processo init mínimo: repassa sinais e recolhe processos órfãos.
    init: true

volumes:
  agentforge-data:
